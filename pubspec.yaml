name: littlehands_gpt
description: A toddler‑friendly AI companion for children aged 2–5.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Text‑to‑speech for speaking responses back to the child
  flutter_tts: ^3.5.2
  # Speech recognition for voice input
  speech_to_text: ^7.3.0
  # Environment variable support for storing secrets like the OpenAI key
  flutter_dotenv: ^5.0.2
  # HTTP client for API calls to OpenAI
  http: ^0.13.5
  # Lottie animations for the mascot
  lottie: ^2.0.0
  # JSON utilities
  json_annotation: ^4.5.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.2.0
  json_serializable: ^6.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/animals/
    - assets/sounds/
    - .env
    - assets/animations/
    - assets/images/animal_bg.png
    - assets/data/offline_prompts.json