name: littlehands_gpt
description: A toddler-friendly, fully offline learning app for children aged 2–5.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # On-device, offline narration (no cloud, no API key)
  flutter_tts: ^4.0.2
  # Local profiles, stars, timer state — no network
  shared_preferences: ^2.2.3
  # Lottie animations for the mascot
  lottie: ^3.1.2
  # JSON utilities
  json_annotation: ^4.5.0
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.2.0
  json_serializable: ^6.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/animals/
    - assets/sounds/
    - assets/sounds/bg_music.mp3
    - assets/animations/
    - assets/images/animal_bg.png
    - assets/data/offline_prompts.json
    - assets/data/activities/
    - assets/animations/jungle.json
